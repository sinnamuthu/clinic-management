
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clinic-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: clinic-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
